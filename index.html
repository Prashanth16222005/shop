<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Premium POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f3f4f8;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-glow: rgba(79, 70, 229, 0.25);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #f43f5e;
      --text-main: #0f172a;
      --text-soft: #64748b;
      --border: #e2e8f0;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Noto Sans Kannada', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Glassmorphic Header */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: #fff;
      font-weight: 800;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .lang-toggle {
      background: #f1f5f9;
      color: var(--primary);
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .lang-toggle:active { transform: scale(0.92); }

    /* Main Scroll Workspace */
    .workspace {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 110px;
      -webkit-overflow-scrolling: touch;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-color);
      padding-bottom: 6px;
    }

    .search-bar {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      transition: all 0.2s;
      user-select: text;
    }
    .search-bar:focus {
      border-color: var(--primary);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-add-item {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn-add-item:active { transform: scale(0.95); }

    /* Modern 2-Column Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid rgba(226, 232, 240, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .card-img-wrap {
      width: 100%;
      height: 110px;
      background: #f8fafc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .card-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
    }

    .fallback-gradient {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2.2rem;
      font-weight: 800;
    }

    .cat-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      color: var(--text-main);
      font-size: 0.6rem;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* Stepper Styling */
    .btn-stepper {
      background: #f1f5f9;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      height: 36px;
    }

    .btn-stepper.add {
      background: var(--primary);
      color: #fff;
      width: 36px;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px var(--primary-glow);
    }
    .btn-stepper.add:active { transform: scale(0.9); }

    .btn-stepper.active-step {
      width: 100%;
      justify-content: space-between;
      padding: 0 4px;
      background: var(--surface);
      border: 1px solid var(--primary);
    }

    .step-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      border-radius: 8px;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
    }
    .step-icon:active { background: #e2e8f0; transform: scale(0.9); }

    /* The box where the number is displayed, tapped to type custom number */
    .step-input-box {
      font-weight: 800;
      font-size: 1rem;
      color: var(--primary);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      width: 40px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      cursor: text;
    }
    .step-input-box:active { background: #f1f5f9; }

    /* Floating Pill Cart */
    .floating-cart {
      position: fixed;
      bottom: 20px;
      left: 5%;
      width: 90%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 20px;
      border-radius: var(--radius-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      z-index: 50;
      transform: translateY(0);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .floating-cart:active { transform: scale(0.96); }
    .floating-cart.hidden { transform: translateY(150px); }

    .cart-info {
      display: flex;
      flex-direction: column;
      color: #fff;
    }

    .cart-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: #34d399;
    }

    .cart-count {
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
    }

    .btn-checkout-pill {
      background: #fff;
      color: var(--text-main);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Modern Bottom Sheet Drawer */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .scrim.show { opacity: 1; }

    .bottom-sheet {
      background: var(--bg-color);
      width: 100%;
      max-height: 85vh;
      border-radius: 32px 32px 0 0;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
    }
    .bottom-sheet.show { transform: translateY(0); }

    .sheet-handle {
      width: 40px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 5px;
      margin: 12px auto;
    }

    .sheet-header {
      padding: 0 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-title {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .btn-clear {
      background: rgba(244, 63, 94, 0.1);
      color: var(--danger);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-row {
      background: var(--surface);
      padding: 12px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .row-info { max-width: 130px; }
    .row-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
    .row-rate { font-size: 0.75rem; color: var(--text-soft); font-weight: 600; }
    
    .row-total {
      font-size: 1.05rem;
      font-weight: 800;
      min-width: 55px;
      text-align: right;
    }

    .sheet-footer {
      background: var(--surface);
      padding: 20px;
      border-radius: 32px 32px 0 0;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.03);
    }

    .quick-cash {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .quick-cash::-webkit-scrollbar { display: none; }

    .cash-pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .cash-pill:active { background: var(--primary); color: #fff; }

    .calc-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }

    .input-glass {
      flex: 1;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      user-select: text;
    }
    .input-glass:focus { border-color: var(--primary); }

    .change-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent);
      min-width: 100px;
      text-align: right;
    }

    .sheet-btns {
      display: flex;
      gap: 12px;
    }

    .btn-close-sheet {
      background: #f1f5f9;
      color: var(--text-main);
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      width: 30%;
    }

    .btn-pay {
      flex: 1;
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1.05rem;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .btn-pay:active { transform: scale(0.97); }

    /* Modal Form / Receipt Styles */
    .center-modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 20px;
    }
    
    .dialog-box {
      background: var(--surface);
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; display: block;}
    .form-input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background: #f8fafc; font-size: 0.9rem; outline: none; user-select: text;
    }

    .receipt-print { text-align: center; }
    .receipt-table { width: 100%; font-size: 0.85rem; text-align: left; margin: 15px 0; border-collapse: collapse; }
    .receipt-table th { border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .receipt-table td { padding: 6px 0; }

    @media print {
      body * { visibility: hidden; }
      .dialog-box.printable, .dialog-box.printable * { visibility: visible; }
      .dialog-box.printable { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; border-radius: 0; }
      .sheet-btns { display: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">₹</div>
      <div class="brand-title" id="uiAppName">Shop POS</div>
    </div>
    <button class="lang-toggle" onclick="toggleLanguage()" id="langToggleBtn">ಕನ್ನಡ</button>
  </header>

  <main class="workspace">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search by name or Item No..." oninput="handleSearch()" />
      <button class="btn-add-item" onclick="openAddModal()">
        <span>➕</span> <span id="uiAddTxt">Add</span>
      </button>
    </div>
    <div class="grid" id="productGrid"></div>
  </main>

  <div class="floating-cart hidden" id="floatCart" onclick="openDrawer()">
    <div class="cart-info">
      <div class="cart-price" id="pillTotal">₹0</div>
      <div class="cart-count"><span id="pillCount">0</span> <span id="uiPillItems">items</span></div>
    </div>
    <button class="btn-checkout-pill">
      <span id="uiViewBill">View Bill</span> 🛒
    </button>
  </div>

  <div class="scrim" id="drawerScrim" onclick="closeDrawer(event)">
    <div class="bottom-sheet" id="bottomSheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="uiOrderTitle">Current Order</h3>
        <button class="btn-clear" onclick="clearCart()" id="uiClearBtn">Clear</button>
      </div>

      <div class="sheet-body" id="drawerList"></div>

      <div class="sheet-footer">
        <div class="quick-cash">
          <button class="cash-pill" onclick="vibrate(); quickCash(10)">+₹10</button>
          <button class="cash-pill" onclick="vibrate(); quickCash(50)">+₹50</button>
          <button class="cash-pill" onclick="vibrate(); quickCash(100)">+₹100</button>
          <button class="cash-pill" onclick="vibrate(); quickCash(500)">+₹500</button>
          <button class="cash-pill" style="background:var(--primary); color:#fff; border:none;" onclick="vibrate(); exactCash()">Exact</button>
        </div>

        <div class="calc-row">
          <input type="number" id="cashGivenInput" class="input-glass" placeholder="Cash Given (₹)" oninput="calcChange()" />
          <div class="change-label" id="changeText">Change: ₹0</div>
        </div>

        <div class="sheet-btns">
          <button class="btn-close-sheet" onclick="closeDrawer()" id="uiCloseLabel">Close</button>
          <button class="btn-pay" onclick="vibrate(); generateBill()" id="uiPayLabel">Print (₹<span id="drawerTotalSum">0</span>)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="center-modal" id="addItemModal">
    <div class="dialog-box">
      <h3 style="font-size: 1.1rem; margin-bottom: 16px;" id="uiNewItemTitle">Add Product</h3>
      <div class="form-group">
        <label id="uiLblEn">Name (English) *</label>
        <input type="text" id="addNameEn" class="form-input" placeholder="e.g. Shikhar" required />
      </div>
      <div class="form-group">
        <label id="uiLblKn">Name (ಕನ್ನಡ)</label>
        <input type="text" id="addNameKn" class="form-input" placeholder="ಉದಾ: ಶಿಖರ್" />
      </div>
      <div class="form-group">
        <label id="uiLblCost">Price (₹) *</label>
        <input type="number" id="addPrice" class="form-input" placeholder="e.g. 50" required />
      </div>
      <div class="form-group">
        <label id="uiLblCat">Category</label>
        <input type="text" id="addCat" class="form-input" placeholder="e.g. Tobacco" />
      </div>
      <div class="form-group">
        <label id="uiLblPhoto">Select Photo</label>
        <input type="file" id="addPhotoFile" accept="image/*" class="form-input" style="padding: 6px;" />
      </div>
      <div class="sheet-btns" style="margin-top: 20px;">
        <button class="btn-close-sheet" onclick="closeAddModal()" id="uiBtnCancel">Cancel</button>
        <button class="btn-pay" onclick="vibrate(); saveCustomItem()" id="uiBtnSave">Save Item</button>
      </div>
    </div>
  </div>

  <div class="center-modal" id="invoiceModal">
    <div class="dialog-box printable receipt-print">
      <h3 style="font-size: 1.2rem; font-weight: 800;" id="uiShopHeader">RETAIL STORE</h3>
      <p style="font-size: 0.75rem; color: var(--text-soft);" id="uiInvoiceMemo">Tax Invoice / Cash Memo</p>
      <p style="font-size: 0.75rem; color: var(--text-soft); margin-bottom: 10px;" id="invoiceTimeDisplay"></p>

      <table class="receipt-table">
        <thead>
          <tr>
            <th id="uiThItem">Item</th>
            <th style="text-align: center;" id="uiThQty">Qty</th>
            <th style="text-align: right;" id="uiThPrice">Total</th>
          </tr>
        </thead>
        <tbody id="invoiceTableBody"></tbody>
      </table>

      <div style="border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 12px; font-size: 0.9rem;">
        <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:4px;">
          <span id="uiNetLabel">Payable:</span>
          <span id="invoiceTotalVal">₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; color:var(--text-soft); margin-bottom:4px;">
          <span id="uiPaidLabel">Cash Paid:</span>
          <span id="invoicePaidVal">₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; color:var(--text-soft);">
          <span id="uiChangeLabel">Change Returned:</span>
          <span id="invoiceChangeVal">₹0</span>
        </div>
      </div>
      <p style="font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-top: 20px;" id="uiThanksNote">Thank you! Visit again.</p>

      <div class="sheet-btns" style="margin-top: 24px;">
        <button class="btn-close-sheet" onclick="closeInvoiceModal()" id="uiBtnCloseInvoice">Close</button>
        <button class="btn-pay" onclick="vibrate(); window.print()" id="uiBtnPrint">🖨️ Print</button>
      </div>
    </div>
  </div>

  <script>
    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    const dict = {
      en: {
        app: "Shop POS", search: "🔍 Search by name or Item No...", toggle: "ಕನ್ನಡ", addTxt: "Add", pillItems: "items", viewBill: "View Bill", orderTitle: "Current Order", clear: "Clear", empty: "Cart is empty.<br>Tap items to add.", cashPlaceholder: "Cash Given (₹)", changeText: "Change: ₹0", changePre: "Change: ₹", duePre: "Due: ₹", close: "Close", payLabel: "Print", newTitle: "Add Product", lblEn: "Name (English) *", lblKn: "Name (ಕನ್ನಡ)", lblCost: "Price (₹) *", lblCat: "Category", lblPhoto: "Select Photo", cancel: "Cancel", save: "Save Item", shopHeader: "RETAIL STORE", invoiceMemo: "Tax Invoice / Cash Memo", thItem: "Item", thQty: "Qty", thPrice: "Total", net: "Payable:", paid: "Cash Paid:", change: "Change Returned:", thanks: "Thank you! Visit again.", print: "🖨️ Print", promptTxt: "Enter quantity:"

    function renderGrid(list) {
      const grid = document.getElementById("productGrid");
      if (list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-soft); padding: 40px 10px;">No items found.</p>`;

      grid.innerHTML = list.map(item => {

        return `
          <div class="card" onclick="modifyQty(${item.id}, 1)">
            <div class="card-img-wrap">
              <span class="cat-tag">${getCat(item)}</span>
              ${item.img ? `
                <img src="${item.img}" class="card-img" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                <div class="fallback-gradient" style="display:none; background:${item.color || 'linear-gradient(135deg, #4f46e5, #818cf8)'};">
                  ${item.nameEn.charAt(0).toUpperCase()}
                </div>
              ` : `
                <div class="fallback-gradient" style="background:${item.color || 'linear-gradient(135deg, #4f46e5, #818cf8)'};">
                  ${item.nameEn.charAt(0).toUpperCase()}
                </div>
              `}
            </div>
            <div class="card-title">${getName(item)}</div>
            <div class="card-bottom">
              <div class="card-price">₹${item.cost}</div>
              <div class="btn-stepper ${inCart > 0 ? 'active-step' : ''}" onclick="event.stopPropagation()">
                ${inCart === 0 ? `
                  <button class="btn-stepper add" onclick="modifyQty(${item.id}, 1)">+</button>
                ` : `
                  <button class="step-icon" onclick="modifyQty(${item.id}, -1)">−</button>
                  <div class="step-input-box" onclick="enterCustomQty(${item.id}, ${inCart})">${inCart}</div>
                  <button class="step-icon" onclick="modifyQty(${item.id}, 1)">+</button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function handleSearch() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = items.filter(i => 
        i.id.toString() === q ||
        (i.nameEn && i.nameEn.toLowerCase().includes(q)) || 
        (i.nameKn && i.nameKn.includes(q)) ||
        (i.catEn && i.catEn.toLowerCase().includes(q)) ||
        (i.catKn && i.catKn.includes(q))
      );
      renderGrid(filtered);
    }

    function modifyQty(id, delta) {
      vibrate();
      if (!cart[id]) {
        if (delta > 0) {
          const product = items.find(i => i.id === id);
          if (product) cart[id] = { ...product, qty: 1 };
        }
      } else {
        cart[id].qty += delta;
        if (cart[id].qty <= 0) delete cart[id];
      }
      renderGrid(items);
      updateCartUI();
    }

    // THE FIX: Click the number to prompt for exact quantity without keyboard glitching
    function enterCustomQty(id, currentQty) {
      vibrate();
      const promptMsg = dict[lang].promptTxt;
      const val = prompt(promptMsg, currentQty);
      if (val !== null && val.trim() !== "") {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed > 0) {
          if (!cart[id]) {
            const product = items.find(i => i.id === id);
            if (product) cart[id] = { ...product, qty: parsed };
          } else {
            cart[id].qty = parsed;
          }
          renderGrid(items);
          updateCartUI();
        } else if (parsed === 0) {
           delete cart[id];
           renderGrid(items);
           updateCartUI();
        }
      }
    }

    function clearCart() {
      vibrate();
      cart = {};
      document.getElementById("cashGivenInput").value = "";
      renderGrid(items);
      updateCartUI();
      closeDrawer();
    }

    function updateCartUI() {
      const listEl = document.getElementById("drawerList");
      const pill = document.getElementById("floatCart");
      const s = dict[lang];
      const keys = Object.keys(cart);
      let count = 0;
      let total = 0;

      if (keys.length === 0) {
        listEl.innerHTML = `<div style="text-align: center; color: var(--text-soft); padding: 50px 10px;">🛒<br>${s.empty}</div>`;
        pill.classList.add("hidden");
      } else {
        pill.classList.remove("hidden");
        listEl.innerHTML = keys.map(k => {
          const item = cart[k];
          const lineSum = item.qty * item.cost;
          count += item.qty;
          total += lineSum;

          return `
            <div class="cart-row">
              <div class="row-info">
                <div class="row-name">${getName(item)}</div>
                <div class="row-rate">₹${item.cost}</div>
              </div>
              <div class="btn-stepper active-step" style="width: 105px;">
                <button class="step-icon" onclick="modifyQty(${item.id}, -1)">−</button>
                <div class="step-input-box" onclick="enterCustomQty(${item.id}, ${item.qty})">${item.qty}</div>
                <button class="step-icon" onclick="modifyQty(${item.id}, 1)">+</button>
              </div>
              <div class="row-total">₹${lineSum}</div>
            </div>
          `;
        }).join("");
      }

      document.getElementById("pillTotal").innerText = `₹${total}`;
      document.getElementById("pillCount").innerText = count;
      document.getElementById("drawerTotalSum").innerText = total;
      calcChange();
    }

    function quickCash(amt) {
      const input = document.getElementById("cashGivenInput");
      const cur = parseFloat(input.value) || 0;
      input.value = cur + amt;
      calcChange();
    }

    function exactCash() {
      const total = parseFloat(document.getElementById("drawerTotalSum").innerText) || 0;
      document.getElementById("cashGivenInput").value = total;
      calcChange();
    }

    function calcChange() {
      const s = dict[lang];
      const total = parseFloat(document.getElementById("drawerTotalSum").innerText) || 0;
      const cash = parseFloat(document.getElementById("cashGivenInput").value) || 0;
      const tag = document.getElementById("changeText");

      if (cash >= total && total > 0) {
        tag.innerText = `${s.changePre}${(cash - total).toFixed(2)}`;
        tag.style.color = "var(--accent)";
      } else if (cash > 0) {
        tag.innerText = `${s.duePre}${(total - cash).toFixed(2)}`;
        tag.style.color = "var(--danger)";
      } else {
        tag.innerText = s.changeText;
        tag.style.color = "var(--text-soft)";
      }
    }

    function saveCustomItem() {
      const nameEn = document.getElementById("addNameEn").value.trim();
      const nameKn = document.getElementById("addNameKn").value.trim() || nameEn;
      const price = parseFloat(document.getElementById("addPrice").value);
      const cat = document.getElementById("addCat").value.trim() || "General";
      const file = document.getElementById("addPhotoFile");

      if (!nameEn || isNaN(price) || price <= 0) {
        alert(lang === "kn" ? "ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು ಬೆಲೆ ನಮೂದಿಸಿ." : "Enter valid name and price.");
        return;
      }

      const gradients = [
        "linear-gradient(135deg, #3b82f6, #1d4ed8)",
        "linear-gradient(135deg, #10b981, #047857)",
        "linear-gradient(135deg, #f59e0b, #b45309)",
        "linear-gradient(135deg, #ef4444, #b91c1c)",
        "linear-gradient(135deg, #8b5cf6, #6d28d9)",
        "linear-gradient(135deg, #ec4899, #be185d)"
      ];
      const randColor = gradients[Math.floor(Math.random() * gradients.length)];

      const inject = (imgBase64) => {
        const newItem = {
          id: Date.now(), nameEn, nameKn, cost: price, catEn: cat, catKn: cat,
          img: imgBase64 || "", color: randColor
        };
        customItems.unshift(newItem);
        localStorage.setItem("pos_pro_custom", JSON.stringify(customItems));
        items.unshift(newItem);
        renderGrid(items);
        closeAddModal();
      };

      if (file.files && file.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => inject(e.target.result);
        reader.readAsDataURL(file.files[0]);
      } else {
        inject("");
      }
    }

    function generateBill() {
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        alert(lang === "kn" ? "ಬಿಲ್ ಮಾಡಲು ಐಟಂ ಸೇರಿಸಿ." : "Add items to generate bill.");
        return;
      }

      let grandTotal = 0;
      document.getElementById("invoiceTableBody").innerHTML = keys.map(k => {
        const item = cart[k];
        const lineTotal = item.qty * item.cost;
        grandTotal += lineTotal;
        return `
          <tr>
            <td style="padding: 6px 0; font-weight: 700;">${getName(item)}</td>
            <td style="text-align: center; padding: 6px 0;">${item.qty}</td>
            <td style="text-align: right; padding: 6px 0; font-weight: 700;">₹${lineTotal}</td>
          </tr>
        `;
      }).join("");

      const paid = parseFloat(document.getElementById("cashGivenInput").value) || grandTotal;
      const change = Math.max(0, paid - grandTotal);

      document.getElementById("invoiceTimeDisplay").innerText = new Date().toLocaleString(lang === "kn" ? "kn-IN" : "en-IN");
      document.getElementById("invoiceTotalVal").innerText = `₹${grandTotal}`;
      document.getElementById("invoicePaidVal").innerText = `₹${paid}`;
      document.getElementById("invoiceChangeVal").innerText = `₹${change}`;

      closeDrawer({target: document.getElementById("drawerScrim")});
      setTimeout(() => { document.getElementById("invoiceModal").style.display = "flex"; }, 300);
    }

    function closeInvoiceModal() {
      vibrate();
      document.getElementById("invoiceModal").style.display = "none";
      clearCart();
    }

    // Init App
    renderGrid(items);
    updateCartUI();
  </script>
